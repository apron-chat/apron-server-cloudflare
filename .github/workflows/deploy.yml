name: Deploy

on:
  # Branches with a pull request are covered by the pull_request run.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # @apron/archive as consumers install it: compiled, and loadable by plain Node.
      - run: npm run build -w @apron/archive
      - run: node --input-type=module -e "const lib = await import('./packages/archive/dist/index.js'); if (typeof lib.readArchive !== 'function') throw new Error('readArchive missing from the build')"

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: server.apron.chat
      url: https://server.apron.chat/?apron_connection_status=1
    # Never cancel a deploy in progress; a newer queued deploy replaces an
    # older one that has not started.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Checks generated-policy freshness and deploys wrangler.production.toml.
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Reacts to the Announce workflow's posts of the pull requests this
  # deploy shipped, as the same bot. It is its own job because the bot token
  # is a secret of the announce environment; without it the job succeeds
  # without reacting.
  deployed:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: announce
    steps:
      - uses: apron-chat/apron-pr-bot/deployed@main
        with:
          server-url: wss://server.apron.chat/
          token: ${{ secrets.APRON_BOT_TOKEN }}
          # Optional; the room the announcements are in, `general` when unset.
          room-id: ${{ vars.APRON_ROOM_ID }}
          reaction: ✅

  # Publishes @apron/archive (packages/archive) when main has a version of it
  # that npm doesn't: bumping `version` in its package.json is the release.
  # No tags. The published package is the compiled build (dist/, see
  # packages/archive/scripts/build.mjs). Without an NPM_TOKEN secret it only
  # says what it would publish.
  publish-archive:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: publish-archive
      cancel-in-progress: false
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          registry-url: https://registry.npmjs.org
      - id: version
        name: Is this version published?
        run: |
          version=$(node -p "require('./packages/archive/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@apron/archive@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.published == 'false'
        run: npm ci
      - if: steps.version.outputs.published == 'false'
        run: npm run build -w @apron/archive
      - if: steps.version.outputs.published == 'false' && env.NPM_TOKEN != ''
        run: npm publish ./packages/archive/dist --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
      - if: steps.version.outputs.published == 'false' && env.NPM_TOKEN == ''
        run: echo "::notice::@apron/archive@${{ steps.version.outputs.version }} is not on npm; set the NPM_TOKEN secret to publish it."
