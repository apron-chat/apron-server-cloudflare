name: Announce

# Posts each pull request merged into main to the demo's general room, as the
# bot whose token is the APRON_BOT_TOKEN secret (from /invite-bot). Without
# that secret the job succeeds without posting.
#
# pull_request_target runs this workflow and script as they are on main, with
# secrets, even for pull requests from forks. It never checks out or runs the
# pull request's head: the event's text reaches the script only as JSON data.
on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  announce:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
          sparse-checkout: |
            .node-version
            scripts/announce-pr.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - run: node scripts/announce-pr.mjs
        env:
          APRON_BOT_TOKEN: ${{ secrets.APRON_BOT_TOKEN }}
