name = "apron-cloudflare-demo-dev"
main = "src/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# The deployed version, shown in the welcome each connection gets.
[version_metadata]
binding = "CF_VERSION_METADATA"

[durable_objects]
bindings = [
  { name = "DEMO", class_name = "ApronDemoServer" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ApronDemoServer"]

# Uploads (src/budget.ts): images in R2, on only with MEDIA_ORIGIN,
# PUBLIC_ORIGIN, and the UPLOAD_SIGNING_KEY secret set (tests set all three).
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "apron-media-dev"

[vars]
RP_ID = "localhost"
RP_ORIGINS = "http://localhost:5173,http://localhost:8787"
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:8787"
# Room titles and descriptions (docs/configuration.md, Runtime overrides), in
# serialized bytes: a room's limit; what every room may always hold; and the
# total of what rooms hold past that minimum, which bounds a listing of every
# room. A save that would grow the total past it is refused.
ROOM_METADATA_LIMIT = "8192"
ROOM_METADATA_MIN_LIMIT = "1024"
ROOM_METADATA_TOTAL_LIMIT = "262144"

# BEGIN GENERATED ADMISSION BUDGET
# Edit src/budget.ts, then run npm run budget:generate.
[[ratelimits]]
name = "CONNECTION_ATTEMPTS"
namespace_id = "73001"
simple = { limit = 60, period = 60 }
[[ratelimits]]
name = "PREFIX_ATTEMPTS"
namespace_id = "73005"
simple = { limit = 180, period = 60 }
[[ratelimits]]
name = "LOCATION_ATTEMPTS"
namespace_id = "73007"
simple = { limit = 1000, period = 60 }
[[ratelimits]]
name = "LIVE_READS"
namespace_id = "73009"
simple = { limit = 1000, period = 60 }
[[ratelimits]]
name = "FLOOD_WATCH"
namespace_id = "73003"
simple = { limit = 600, period = 60 }
# END GENERATED ADMISSION BUDGET
