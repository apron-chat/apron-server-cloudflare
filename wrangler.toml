name = "apron-cloudflare-demo-dev"
main = "src/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# The deployed version, shown in the welcome each connection gets.
[version_metadata]
binding = "CF_VERSION_METADATA"

[durable_objects]
bindings = [
  { name = "DEMO", class_name = "ApronDemoServer" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ApronDemoServer"]

# Uploads (src/budget.ts): images in R2, on only with MEDIA_ORIGIN,
# PUBLIC_ORIGIN, and the UPLOAD_SIGNING_KEY secret set (tests set all three).
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "apron-media-dev"

# History segments and backups (PLAN §9): a private bucket, no public access.
# Used by the tests and `wrangler dev` (miniflare's local R2); production
# has none yet, so the blob tier is off there.
[[r2_buckets]]
binding = "HISTORY_BLOB"
bucket_name = "apron-history-dev"

# The D1 history tier (src/history/d1.ts, docs/configuration.md, History
# tiers). Records there stay in history but become read-only: past
# retentionRecords, the oldest move from the object's SQLite to D1, where
# history pages still read them but their messages can no longer be edited,
# reacted to or replied to; past archiveRecords more, they expire. Local
# development and the tests use a local database; the id is a placeholder.
[[d1_databases]]
binding = "HISTORY_D1"
database_name = "apron-archive-dev"
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
RP_ID = "localhost"
RP_ORIGINS = "http://localhost:5173,http://localhost:8787"
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:8787"
# Off by default, and here above all: every project on localhost shares that
# RP ID, so the passkey page must not ask the browser to drop a passkey this
# server has never seen.
SIGNAL_UNKNOWN_PASSKEYS = "false"
# Room titles and descriptions (docs/configuration.md, Runtime overrides), in
# serialized bytes: a room's limit; what every room may always hold; and the
# total of what rooms hold past that minimum, which bounds a listing of every
# room. A save that would grow the total past it is refused.
ROOM_METADATA_LIMIT = "8192"
ROOM_METADATA_MIN_LIMIT = "1024"
ROOM_METADATA_TOTAL_LIMIT = "262144"

# BEGIN GENERATED ADMISSION BUDGET
# Edit src/budget.ts, then run npm run budget:generate.
[[ratelimits]]
name = "CONNECTION_ATTEMPTS"
namespace_id = "73001"
simple = { limit = 60, period = 60 }
[[ratelimits]]
name = "PREFIX_ATTEMPTS"
namespace_id = "73005"
simple = { limit = 180, period = 60 }
[[ratelimits]]
name = "LOCATION_ATTEMPTS"
namespace_id = "73007"
simple = { limit = 1000, period = 60 }
[[ratelimits]]
name = "LIVE_READS"
namespace_id = "73009"
simple = { limit = 1000, period = 60 }
[[ratelimits]]
name = "FLOOD_WATCH"
namespace_id = "73003"
simple = { limit = 600, period = 60 }
# END GENERATED ADMISSION BUDGET
