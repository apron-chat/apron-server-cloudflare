name = "apron-cloudflare-demo-dev"
main = "src/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# The deployed version, shown in the welcome each connection gets.
[version_metadata]
binding = "CF_VERSION_METADATA"

[durable_objects]
bindings = [
  { name = "DEMO", class_name = "ApronDemoServer" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ApronDemoServer"]

# Uploads (src/budget.ts): images in R2, on only with MEDIA_ORIGIN,
# PUBLIC_ORIGIN, and the UPLOAD_SIGNING_KEY secret set (tests set all three).
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "apron-media-dev"

# The cold history tier and backups (docs/configuration.md, History tiers,
# Backups and imports): a private bucket, no public access. Used by the
# tests and `wrangler dev` (miniflare's local R2): bound, it is the tier
# below D1, keeping chunks under history/, and backups go under backups/.
[[r2_buckets]]
binding = "HISTORY_BLOB"
bucket_name = "apron-history-dev"

# The D1 history tier (src/history/d1.ts, docs/configuration.md, History
# tiers). Records there stay in history but become read-only: past
# LIMIT_HISTORY_HOT_RECORDS, the oldest move from the object's SQLite to D1,
# where history pages still read them but their messages can no longer be
# edited, reacted to or replied to; past LIMIT_HISTORY_D1_RECORDS more, they
# go on to the cold tier (HISTORY_BLOB, above). Local development and the
# tests use a local database; the id is a placeholder.
[[d1_databases]]
binding = "HISTORY_D1"
database_name = "apron-archive-dev"
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
# Local development (`wrangler dev`) and the tests. Every variable is
# documented in docs/configuration.md; limits are set as LIMIT_<NAME>.

# ---- Passkeys and origins ----
# The local web client and this Worker. SIGNAL_UNKNOWN_PASSKEYS is off by
# default, and here above all: every project on localhost shares that RP ID,
# so the passkey page must not ask the browser to drop a passkey this server
# has never seen.
RP_ID = "localhost"
RP_ORIGINS = "http://localhost:5173,http://localhost:8787"
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:8787"
SIGNAL_UNKNOWN_PASSKEYS = "false"

# ---- History and backups ----
# The plan's own history limits written out, as in production (History
# retention, History tiers). Backups on demand only (/history export, no
# schedule) to the local HISTORY_BLOB bucket, the newest 14 of each kind kept,
# private rooms included, gzip-compressed (not encrypted).
LIMIT_HISTORY_HOT_RECORDS = "5000"
LIMIT_HISTORY_D1_RECORDS = "100000"
LIMIT_HISTORY_COLD_RECORDS = "0"
LIMIT_HISTORY_MAX_AGE_SECONDS = "0"
LIMIT_CLEANUP_THRESHOLD_PERCENT = "80"
BACKUP_EVERY = ""
BACKUP_KEEP = "14"
BACKUP_PRIVATE_ROOMS = "true"

# ---- Rooms ----
# As in production: the room caps count rooms started in the last 30 days,
# and room titles and descriptions are bounded in serialized bytes (a room's
# limit, what every room may always hold, and the total past that minimum).
LIMIT_ROOM_CREATION_WINDOW_SECONDS = "2592000"
LIMIT_ROOM_METADATA_BYTES = "8192"
LIMIT_ROOM_METADATA_MIN_BYTES = "1024"
LIMIT_ROOM_METADATA_TOTAL_BYTES = "262144"

# BEGIN GENERATED ADMISSION BUDGET
# Edit src/budget.ts, then run npm run budget:generate.
[[ratelimits]]
name = "CONNECTION_ATTEMPTS"
namespace_id = "73001"
simple = { limit = 60, period = 60 }
[[ratelimits]]
name = "PREFIX_ATTEMPTS"
namespace_id = "73005"
simple = { limit = 180, period = 60 }
[[ratelimits]]
name = "LOCATION_ATTEMPTS"
namespace_id = "73007"
simple = { limit = 1000, period = 60 }
[[ratelimits]]
name = "LIVE_READS"
namespace_id = "73009"
simple = { limit = 1000, period = 60 }
[[ratelimits]]
name = "FLOOD_WATCH"
namespace_id = "73003"
simple = { limit = 600, period = 60 }
# END GENERATED ADMISSION BUDGET
