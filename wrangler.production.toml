name = "apron-cloudflare-demo"
main = "src/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
# Previews are served only at <preview>.previews.apron.chat (enabled = false:
# never production); Cloudflare adds the wildcard DNS record and certificate
# with the first Preview. See [previews.vars] below and docs/guide.md, Previews.
routes = [
  { pattern = "server.apron.chat", custom_domain = true },
  { pattern = "previews.apron.chat", custom_domain = true, previews_enabled = true, enabled = false }
]

[observability]
enabled = true
# Every request writes a log event, billed by the GB from 2026-12-01 (by the
# event before); keep one in ten so a flood costs mostly its requests. The
# budget guard's log estimate assumes at most this rate (src/plans/paid.ts
# logEstimate), and npm run budget:check refuses more.
head_sampling_rate = 0.1

# The deployed version, shown in the welcome each connection gets.
[version_metadata]
binding = "CF_VERSION_METADATA"

[durable_objects]
bindings = [
  { name = "DEMO", class_name = "ApronDemoServer" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ApronDemoServer"]

[vars]
# A parent domain of this server's host: anything else on apron.chat may issue
# passkeys for it, which this server cannot see. Leave SIGNAL_UNKNOWN_PASSKEYS
# unset (off) unless this server is the sole user of this RP ID, or the
# passkey page would ask devices to drop those passkeys
# (docs/configuration.md).
RP_ID = "apron.chat"
RP_ORIGINS = "https://web.apron.chat"
ALLOWED_ORIGINS = "*"
# The server frame's title, description and avatar (docs/configuration.md,
# Server title, description and avatar); an admin's /server overrides each.
SERVER_TITLE = "Apron Demo"
SERVER_DESCRIPTION = "The public demo of [Apron](https://github.com/shazow/apron), an open chat protocol."
# The Apron icon, square at 512px, served by apron-web.
SERVER_AVATAR = "https://web.apron.chat/icon-512.png"
# Room titles and descriptions (docs/configuration.md, Runtime overrides), in
# serialized bytes: a room's limit; what every room may always hold; and the
# total of what rooms hold past that minimum, which bounds a listing of every
# room. A save that would grow the total past it is refused.
ROOM_METADATA_LIMIT = "8192"
ROOM_METADATA_MIN_LIMIT = "1024"
ROOM_METADATA_TOTAL_LIMIT = "262144"
ACCOUNT_ID = "2bfd32937c0c07a923c79f6bb1a17253"
# The dataset METRICS (below) writes, for /status to read active users back
# (src/active-users.ts); npm run budget:check holds the two equal.
METRICS_DATASET = "apron_server_metrics"
# The apron.chat zone, where the budget guard turns the apron_budget_stop rule
# on and off (with the EDGE_STOP_TOKEN secret).
ZONE_ID = "d7467571c212da5b57bbc92afeb967b7"
# Uploads: the bucket's public domain, and where write URLs point. Uploads are
# off until the UPLOAD_SIGNING_KEY secret is set too.
MEDIA_ORIGIN = "https://media.apron.chat"
PUBLIC_ORIGIN = "https://server.apron.chat"
# The media host sends X-Content-Type-Options: nosniff (the apron_media_nosniff
# edge rule, docs/edge-rules.generated.json), so attachments may be text.
MEDIA_NOSNIFF = "true"
# Push (src/webpush.ts): on only with the VAPID_PRIVATE_KEY secret set too.
# The private key must match this public key.
VAPID_PUBLIC_KEY = "BF-ztm22-yk6-AvyxkBGWzxaiA_CnO1c9vDAe1-RMg0WJ_EuNgmPhxxTyUq6J0nhaFxNxmcFsAc6KVfWLkdDl0M"
VAPID_SUBJECT = "https://server.apron.chat"
# The push services registrations may name: the browsers' own (the default,
# src/config.ts DEFAULT_PUSH_HOSTS), and push.stupidtech.net added to them.
PUSH_HOSTS_EXTRA = "push.stupidtech.net"

# The history archive (src/archive.ts, docs/configuration.md, History
# retention). Archived records stay in history but become read-only: once
# the object's own SQLite holds more than retentionRecords (LIMIT_RETENTION_RECORDS),
# the oldest move here, where history pages still read them, but their
# messages can no longer be edited, reacted to or replied to. The archive
# keeps archiveRecords (LIMIT_ARCHIVE_RECORDS) of them, then they expire.
# Both counts are ceilings: cleanup keeps cleanupThresholdPercent
# (LIMIT_CLEANUP_THRESHOLD_PERCENT, 80) of each, and runs early once the
# object's SQLite passes its share.
# Without this binding, records past retentionRecords expire at once. The
# object creates its table on first use. Previews bind none (below), so
# theirs expire at once.
[[d1_databases]]
binding = "ARCHIVE"
database_name = "apron-archive"
database_id = "67f4435a-f9d4-4c9a-89e0-c02f108d4fa2"

# Uploaded images (src/budget.ts). The bucket needs lifecycle rules deleting
# f/ after 120 days and a/ after 61 or more (none for e/, custom emoji), a custom domain
# for MEDIA_ORIGIN, and a CORS policy allowing GET from any origin for the
# custom emoji catalog (docs/configuration.md, Uploads).
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "apron-media"

# Exact operational counters (src/metrics.ts): stale closes, alarms, pushes,
# accounting and edge-stop changes. Analytics Engine creates the dataset on
# its first write; `npm run usage:report` reads it back.
[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "apron_server_metrics"

# The budget guard checks account usage every minute (src/budget-guard.ts).
[triggers]
crons = ["* * * * *"]

# Previews (docs/guide.md, Previews): `npx wrangler preview --config
# wrangler.production.toml`. They inherit no vars or bindings, so these repeat
# production's where a Preview needs them; each Preview has its own Durable
# Object and storage, its own rate limiters (generated below) and metrics
# dataset, and no crons: production's budget guard watches the account, and
# its apron_budget_stop rule covers the Preview hosts. Observability (one log
# in ten) is inherited. No Preview secrets are needed; production's are not
# inherited (`npx wrangler preview base-config secret put` adds them).
[previews.vars]
# Preview passkeys belong to their own RP ID, never to production's
# apron.chat; every Preview host is under it, so each serves the passkey page.
RP_ID = "previews.apron.chat"
# No client is on that RP ID's own origin, which nothing serves: every client,
# web.apron.chat and apron-web Previews included, signs in through the passkey
# page. (RP_ORIGINS must list one exact origin when ALLOWED_ORIGINS is *.)
RP_ORIGINS = "https://previews.apron.chat"
# Every Preview shares that RP ID with its own storage, so another Preview's
# passkey is unknown here but not stale: the page must not ask the device to
# drop it.
SIGNAL_UNKNOWN_PASSKEYS = "false"
ALLOWED_ORIGINS = "*"
# The Previews' own dataset (below), never production's.
METRICS_DATASET = "apron_server_metrics_preview"
SERVER_TITLE = "Apron Demo (preview)"
SERVER_DESCRIPTION = "The public demo of [Apron](https://github.com/shazow/apron), an open chat protocol."
SERVER_AVATAR = "https://web.apron.chat/icon-512.png"
# Off in production; on here so Previews exercise external sign-in too.
EXTERNAL_SIGN_IN = "true"
ROOM_METADATA_LIMIT = "8192"
ROOM_METADATA_MIN_LIMIT = "1024"
ROOM_METADATA_TOTAL_LIMIT = "262144"
# Inert without the ACCOUNT_ANALYTICS_TOKEN and EDGE_STOP_TOKEN secrets, which
# Previews lack: the budget guard runs only in production.
ACCOUNT_ID = "2bfd32937c0c07a923c79f6bb1a17253"
ZONE_ID = "d7467571c212da5b57bbc92afeb967b7"
# Uploads, live text and push are off, empty here so that `wrangler preview`
# sees them set: PUBLIC_ORIGIN is one fixed origin, where each Preview has its
# own (npm run budget:check refuses one here), and push needs VAPID keys of
# its own. Without uploads no MEDIA bucket is bound, which `wrangler preview`
# lists as missing; that is expected.
MEDIA_ORIGIN = ""
PUBLIC_ORIGIN = ""
MEDIA_NOSNIFF = ""
VAPID_PUBLIC_KEY = ""
VAPID_SUBJECT = ""
# For when push is on.
PUSH_HOSTS_EXTRA = "push.stupidtech.net"

[previews.version_metadata]
binding = "CF_VERSION_METADATA"

[previews.durable_objects]
bindings = [
  { name = "DEMO", class_name = "ApronDemoServer" }
]

# Created on its first write, apart from production's counters.
[[previews.analytics_engine_datasets]]
binding = "METRICS"
dataset = "apron_server_metrics_preview"

# BEGIN GENERATED ADMISSION BUDGET
# Edit src/budget.ts, then run npm run budget:generate.
[[ratelimits]]
name = "CONNECTION_ATTEMPTS"
namespace_id = "73002"
simple = { limit = 60, period = 60 }
[[ratelimits]]
name = "PREFIX_ATTEMPTS"
namespace_id = "73006"
simple = { limit = 180, period = 60 }
[[ratelimits]]
name = "LOCATION_ATTEMPTS"
namespace_id = "73008"
simple = { limit = 1000, period = 60 }
[[ratelimits]]
name = "LIVE_READS"
namespace_id = "73010"
simple = { limit = 1000, period = 60 }
[[ratelimits]]
name = "FLOOD_WATCH"
namespace_id = "73004"
simple = { limit = 600, period = 60 }
# Previews: the same limits, counted apart from production's.
[[previews.ratelimits]]
name = "CONNECTION_ATTEMPTS"
namespace_id = "73011"
simple = { limit = 60, period = 60 }
[[previews.ratelimits]]
name = "PREFIX_ATTEMPTS"
namespace_id = "73013"
simple = { limit = 180, period = 60 }
[[previews.ratelimits]]
name = "LOCATION_ATTEMPTS"
namespace_id = "73014"
simple = { limit = 1000, period = 60 }
[[previews.ratelimits]]
name = "LIVE_READS"
namespace_id = "73015"
simple = { limit = 1000, period = 60 }
[[previews.ratelimits]]
name = "FLOOD_WATCH"
namespace_id = "73012"
simple = { limit = 600, period = 60 }
# END GENERATED ADMISSION BUDGET
