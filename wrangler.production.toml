[[ratelimits]]
name = "CONNECTION_ATTEMPTS"
namespace_id = "73002"
simple = { limit = 60, period = 60 }
[[ratelimits]]
name = "PREFIX_ATTEMPTS"
namespace_id = "73006"
simple = { limit = 180, period = 60 }
[[ratelimits]]
name = "LOCATION_ATTEMPTS"
namespace_id = "73008"
simple = { limit = 1000, period = 60 }
[[ratelimits]]
name = "LIVE_READS"
namespace_id = "73010"
simple = { limit = 1000, period = 60 }
[[ratelimits]]
name = "FLOOD_WATCH"
namespace_id = "73004"
simple = { limit = 600, period = 60 }
# Previews: the same limits, counted apart from production's.
[[previews.ratelimits]]
name = "CONNECTION_ATTEMPTS"
namespace_id = "73011"
simple = { limit = 60, period = 60 }
[[previews.ratelimits]]
name = "PREFIX_ATTEMPTS"
namespace_id = "73013"
simple = { limit = 180, period = 60 }
[[previews.ratelimits]]
name = "LOCATION_ATTEMPTS"
namespace_id = "73014"
simple = { limit = 1000, period = 60 }
[[previews.ratelimits]]
name = "LIVE_READS"
namespace_id = "73015"
simple = { limit = 1000, period = 60 }
[[previews.ratelimits]]
name = "FLOOD_WATCH"
namespace_id = "73012"
simple = { limit = 600, period = 60 }
