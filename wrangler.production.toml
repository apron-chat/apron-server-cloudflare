name = "apron-cloudflare-demo"
main = "src/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
routes = [
  { pattern = "server.apron.chat", custom_domain = true }
]

[observability]
enabled = true

# The deployed version, shown in the welcome each connection gets.
[version_metadata]
binding = "CF_VERSION_METADATA"

[durable_objects]
bindings = [
  { name = "DEMO", class_name = "ApronDemoServer" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ApronDemoServer"]

[vars]
RP_ID = "apron.chat"
RP_ORIGINS = "https://web.apron.chat"
ALLOWED_ORIGINS = "*"
ACCOUNT_ID = "2bfd32937c0c07a923c79f6bb1a17253"
# The apron.chat zone, where the budget guard turns the apron_budget_stop rule
# on and off (with the EDGE_STOP_TOKEN secret).
ZONE_ID = "d7467571c212da5b57bbc92afeb967b7"

# The budget guard checks account usage every minute (src/budget-guard.ts).
[triggers]
crons = ["* * * * *"]

# BEGIN GENERATED ADMISSION BUDGET
# Edit src/budget.ts, then run npm run budget:generate.
[[ratelimits]]
name = "CONNECTION_ATTEMPTS"
namespace_id = "73002"
simple = { limit = 10, period = 60 }
# END GENERATED ADMISSION BUDGET
