name = "apron-cloudflare-demo"
main = "src/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
routes = [
  { pattern = "server.apron.chat", custom_domain = true }
]

[observability]
enabled = true
# Every request writes a log event, billed past 20 million a month; keep one
# in ten so a flood costs mostly its requests.
head_sampling_rate = 0.1

# The deployed version, shown in the welcome each connection gets.
[version_metadata]
binding = "CF_VERSION_METADATA"

[durable_objects]
bindings = [
  { name = "DEMO", class_name = "ApronDemoServer" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ApronDemoServer"]

[vars]
RP_ID = "apron.chat"
RP_ORIGINS = "https://web.apron.chat"
ALLOWED_ORIGINS = "*"
ACCOUNT_ID = "2bfd32937c0c07a923c79f6bb1a17253"
# The apron.chat zone, where the budget guard turns the apron_budget_stop rule
# on and off (with the EDGE_STOP_TOKEN secret).
ZONE_ID = "d7467571c212da5b57bbc92afeb967b7"
# Uploads: the bucket's public domain, and where write URLs point. Uploads are
# off until the UPLOAD_SIGNING_KEY secret is set too.
MEDIA_ORIGIN = "https://media.apron.chat"
PUBLIC_ORIGIN = "https://server.apron.chat"
# Push (src/webpush.ts): on only with the VAPID_PRIVATE_KEY secret set too.
# The private key must match this public key.
VAPID_PUBLIC_KEY = "BF-ztm22-yk6-AvyxkBGWzxaiA_CnO1c9vDAe1-RMg0WJ_EuNgmPhxxTyUq6J0nhaFxNxmcFsAc6KVfWLkdDl0M"
VAPID_SUBJECT = "https://server.apron.chat"

# Uploaded images (src/budget.ts). The bucket needs lifecycle rules deleting
# f/ after 7 days and a/ after 30, and a custom domain for MEDIA_ORIGIN.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "apron-media"

# The budget guard checks account usage every minute (src/budget-guard.ts).
[triggers]
crons = ["* * * * *"]

# BEGIN GENERATED ADMISSION BUDGET
# Edit src/budget.ts, then run npm run budget:generate.
[[ratelimits]]
name = "CONNECTION_ATTEMPTS"
namespace_id = "73002"
simple = { limit = 10, period = 60 }
[[ratelimits]]
name = "FLOOD_WATCH"
namespace_id = "73004"
simple = { limit = 60, period = 60 }
# END GENERATED ADMISSION BUDGET
